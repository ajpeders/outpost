# smarthome — livingroom-pi stack (hub + appletv + cec on docker compose;
# screen-player / aerial-screen on host systemd, NOT redeployed here — those
# are user-visible per CLAUDE.md, so the GUARD_CMD below defers while
# someone is watching rather than blipping the TV mid-stream).
#
# Plain `docker compose build` fails on this Pi (buildx too old). CLAUDE.md
# pins DOCKER_BUILDKIT=0. `--force-recreate` is load-bearing for the
# dashboard/static files (single-file bind mounts: replace-in-place changes
# the inode while the running container stays bound to the old one) — same
# trap as isis-alex's dashboard.conf.
APP_DIR="/home/alex/projects/smarthome"
BRANCH="main"

# Skip this tick if mpv is actively playing. screen-player is host-side so a
# rebuild wouldn't kill it, but CLAUDE.md still wants us to defer — hub
# rebuilds blip the phone UI, and an appletv rebuild mid-stream is the
# obvious footgun. 45s status TTL is plenty; this is a polling guard, not a
# control plane.
GUARD_CMD='curl -fsS --max-time 5 http://127.0.0.1:9595/status 2>/dev/null | grep -q "\"playing\":[[:space:]]*true"'

DEPLOY_CMD='DOCKER_BUILDKIT=0 docker compose up -d --build --force-recreate'

HEALTH_CMD='for c in hub appletv cec; do
  [ "$(docker inspect -f "{{.State.Status}} {{.RestartCount}}" "$c")" = "running 0" ] || exit 1
done
curl -fsS --max-time 5 -o /dev/null localhost:8080/api/health && \
curl -fsS --max-time 5 -o /dev/null localhost:8010/ && \
curl -fsS --max-time 5 -o /dev/null localhost:8020/docs'

HEALTH_TRIES=4
HEALTH_DELAY=10
