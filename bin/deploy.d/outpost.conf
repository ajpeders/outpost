# Outpost — living-room stack.
#
# Two halves, per CLAUDE.md:
#   - hub / appletv / cec  -> Docker (rebuilt here)
#   - screen-player / aerial-screen  -> HOST systemd (also redeployed here)
#
# The host screen services run screen/screen_player.py and screen/aerial-mode.py
# directly from the checkout, so a git fast-forward alone does NOT pick up
# changes to screen/*.py — the running services keep the old code until
# restarted. install-services.sh re-substitutes %%REPO%% into the committed unit
# files (so a change to screen/*.service lands too), then we restart both units.
#
# GUARD_CMD below defers while mpv is playing: a screen-player restart kills the
# current mpv session mid-stream. CLAUDE.md "Deploy etiquette" — never restart
# while someone's watching.
APP_DIR="/home/alex/projects/outpost"
BRANCH="main"

# Defer this tick if mpv is actively playing. 45s status TTL is plenty; this is
# a polling guard, not a control plane.
GUARD_CMD='curl -fsS --max-time 5 http://127.0.0.1:9595/status 2>/dev/null | grep -q "\"playing\":[[:space:]]*true"'

# Order mirrors docs/mtv-launch.md "Deploy": reinstall host units, reload,
# restart screen-player (its startup calls _kiosk("start") -> aerial-screen),
# then restart aerial-screen so aerial-mode.py changes land too, then rebuild
# docker. Plain `docker compose build` fails on this Pi (buildx too old) — pinned
# DOCKER_BUILDKIT=0. `--force-recreate` is load-bearing for the dashboard/static
# files (single-file bind mounts: replace-in-place changes the inode while the
# running container stays bound to the old one) — same trap as isis-alex's
# dashboard.conf.
DEPLOY_CMD='sudo screen/install-services.sh screen-player aerial-screen kiosk-screen && \
sudo systemctl daemon-reload && \
sudo systemctl restart screen-player && \
sudo systemctl restart aerial-screen && \
DOCKER_BUILDKIT=0 docker compose up -d --build --force-recreate'

HEALTH_CMD='for c in hub appletv cec; do
  [ "$(docker inspect -f "{{.State.Status}} {{.RestartCount}}" "$c")" = "running 0" ] || exit 1
done
[ "$(systemctl is-active screen-player)" = "active" ] || exit 1
curl -fsS --max-time 5 -o /dev/null localhost:8080/api/health && \
curl -fsS --max-time 5 -o /dev/null localhost:8010/ && \
curl -fsS --max-time 5 -o /dev/null localhost:8020/docs'

HEALTH_TRIES=4
HEALTH_DELAY=10
