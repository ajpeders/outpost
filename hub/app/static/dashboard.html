<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Room</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
  .hidden { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "DejaVu Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: #05070d;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    /* readability over the aerial video / photo — all text is pure white */
    text-shadow: 0 2px 14px rgba(0,0,0,.55), 0 1px 4px rgba(0,0,0,.8);
  }
  /* simplistic monochrome (white) line icons — no color emoji */
  .icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.12em; }
  .icon svg { width: 100%; height: 100%; display: block; fill: none;
              stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
              filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  .icon .fill { fill: #fff; stroke: none; }
  /* overlay mode (?overlay=1): transparent page so mpv can composite the widgets
     over a hardware-decoded aerial video underneath (headless-rendered PNG). */
  body.overlay { background: transparent !important; }
  body.overlay #aurora { display: none !important; }
  body.overlay::after { display: none !important; }
  body.overlay .shell { text-shadow: 0 2px 18px rgba(0,0,0,.7); }

  /* ambient background: static aurora gradient (non-overlay fallback only) */
  #aurora {
    position: fixed; inset: 0; z-index: -3;
    background:
      radial-gradient(60% 80% at 20% 20%, #16324d 0%, transparent 60%),
      radial-gradient(60% 80% at 85% 15%, #0e3b3a 0%, transparent 55%),
      radial-gradient(80% 90% at 70% 90%, #241636 0%, transparent 60%),
      linear-gradient(160deg, #060a14, #05070d);
  }
  /* readability veil (non-overlay only) */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, rgba(3,5,10,.55) 0%, rgba(3,5,10,.15) 35%, rgba(3,5,10,.55) 100%);
  }

  .shell { height: 100%; display: flex; flex-direction: column; justify-content: space-between;
           padding: 5vh 4vw; }

  /* ---- top band ---- */
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .clock { display: inline-flex; align-items: baseline; font-size: 9vw; font-weight: 700;
           line-height: .95; font-variant-numeric: tabular-nums; }
  .clock .sec  { display: inline-block; min-width: 3ch; font-size: 3vw; font-weight: 700; }
  .clock .ampm { font-size: 3vw; font-weight: 700; margin-left: .15em; }
  .date { font-size: 2.2vw; font-weight: 600; margin-top: .6vh; opacity: .95; }

  .forecast-head { display: flex; align-items: center; gap: .8vw; margin-bottom: 1vh; min-width: 0; }
  .wx-icon { font-size: 2.4vw; line-height: 1; }
  .wx-temp { font-size: 2.6vw; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .wx-cond { font-size: 1.15vw; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- bottom band: one flex row of tiles ---- */
  .bottom { display: flex; gap: 1.2vw; align-items: stretch; }
  .tile { display: flex; flex-direction: column; min-width: 0; overflow: hidden;
          background: rgba(5,7,13,.55); border: 1px solid rgba(255,255,255,.14);
          border-radius: 1.2vw; padding: 1.6vh 1.2vw; }
  .tile.hidden { display: none; }
  .forecast { flex: 2 1 0; }
  .server, .media, .alarm, .nowplaying { flex: 1 1 0; }
  .tile-label { font-size: 1vw; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
                opacity: .65; margin-bottom: .9vh; white-space: nowrap; overflow: hidden;
                text-overflow: ellipsis; }

  /* forecast: seven equal columns, sized to fit inside the tile */
  .forecast-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .3vw; flex: 1; }
  .fc { display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: .2vh; min-width: 0; }
  .fc .d { font-size: .95vw; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
           white-space: nowrap; }
  .fc .i { font-size: 2.1vw; line-height: 1; }
  .fc .t { font-size: 1vw; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fc .t .lo { font-weight: 500; opacity: .8; }

  /* server: five labelled readouts in a row */
  .server-row { display: flex; align-items: stretch; flex: 1; min-width: 0; }
  .stat { flex: 1 1 0; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: .35vh; min-width: 0; padding: 0 .6vw; }
  .stat + .stat { border-left: 1px solid rgba(255, 255, 255, .12); }
  .stat .v { font-size: 1.3vw; font-weight: 700; line-height: 1.05;
             font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .k { font-size: .8vw; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
             opacity: .55; white-space: nowrap; }
  .server-note { font-size: 1.3vw; font-weight: 600; opacity: .9; align-self: center;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* media: Plex poster + Plex line + livestream (title, progress) */
  .media-body { display: flex; align-items: center; gap: .8vw; min-width: 0; flex: 1; }
  .media-art { width: 3vw; height: 4.5vw; object-fit: cover; border-radius: .4vw; flex: none;
               background: rgba(255,255,255,.06); }
  .media-lines { min-width: 0; flex: 1; }
  .media-lines > * + * { margin-top: .7vh; }
  .media-line { font-size: 1.1vw; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  .media-line .muted { opacity: .6; font-weight: 500; }
  .media-sub { font-size: .9vw; opacity: .75; font-variant-numeric: tabular-nums;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: .3vh; }
  .media-bar { height: .35vh; min-height: 3px; border-radius: 2px; margin-top: .5vh;
               background: rgba(255,255,255,.18); overflow: hidden; }
  .media-bar > i { display: block; height: 100%; width: 0; background: #ff5252; }
  .live-dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%;
              background: #ff5252; margin-right: .4em; vertical-align: .05em;
              box-shadow: 0 0 8px rgba(255,82,82,.8); }

  /* alarm + now-playing */
  .alarm-time { font-size: 1.6vw; font-weight: 700; font-variant-numeric: tabular-nums; }
  .alarm-when { font-size: 1vw; font-weight: 600; opacity: .75; margin-top: .4vh;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np-title { font-size: 1.4vw; font-weight: 700; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .np-sub { font-size: 1vw; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div id="aurora"></div>

  <div class="shell">
    <header class="top">
      <div>
        <div class="clock"><span id="time">–</span><span class="sec" id="sec"></span><span class="ampm" id="ampm"></span></div>
        <div class="date" id="date"></div>
      </div>
    </header>

    <main class="mid"></main>

    <footer class="bottom">
      <section class="tile forecast" id="tile-forecast">
        <div class="forecast-head">
          <span class="wx-icon" id="wx-icon"></span>
          <span class="wx-temp" id="wx-temp">–</span>
          <span class="wx-cond" id="wx-cond"></span>
        </div>
        <div class="forecast-grid" id="forecast"></div>
      </section>
      <section class="tile server" id="tile-server">
        <div class="tile-label" id="server-label">Server</div>
        <div class="server-row" id="server-row"></div>
      </section>
      <section class="tile media hidden" id="tile-media">
        <div class="tile-label">Media</div>
        <div class="media-body">
          <img class="media-art hidden" id="media-art" alt="">
          <div class="media-lines">
            <div class="media-line hidden" id="media-plex"></div>
            <div class="media-live hidden" id="media-live">
              <div class="media-line" id="media-live-title"></div>
              <div class="media-sub hidden" id="media-live-sub"></div>
              <div class="media-bar hidden" id="media-live-bar"><i></i></div>
            </div>
          </div>
        </div>
      </section>
      <section class="tile alarm hidden" id="tile-alarm">
        <div class="tile-label">Alarm</div>
        <div class="alarm-time" id="alarm-time"></div>
        <div class="alarm-when" id="alarm-when"></div>
      </section>
      <section class="tile nowplaying hidden" id="tile-np">
        <div class="tile-label">Now Playing</div>
        <div class="np-title" id="np-title"></div>
        <div class="np-sub" id="np-sub"></div>
      </section>
    </footer>
  </div>

<script>
// ---- config ----
const params = new URLSearchParams(location.search);
const OVERLAY = params.has('overlay');
if (OVERLAY) document.body.classList.add('overlay');   // transparent page for mpv compositing
const roomHost = params.get('host') || location.hostname || 'pi';
let LAT = Number(params.get('lat')) || 39.7392;
let LON = Number(params.get('lon')) || -104.9903;
let CITY = params.get('city') || '';
const WEATHER_CACHE_KEY = 'livingroom-dashboard-weather-v2';
const HOMELAB_CACHE_KEY = 'livingroom-dashboard-homelab-v1';
const WEATHER_FRESH = 10 * 60 * 1000;   // 10 min
const HOMELAB_FRESH = 10 * 60 * 1000;   // 10 min
// simplistic monochrome (white) line icons — no color emoji
const ICONS = {
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.5M12 18.9v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.6 12h2.5M18.9 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>',
  partly:'<svg viewBox="0 0 24 24"><circle cx="8" cy="7.5" r="2.8"/><path d="M8 2.4v1.5M3.5 7.5H2M13 7.5h-1.5M4.6 4.1l1 1M11.4 4.1l-1 1"/><path d="M7.5 19.5h8.2a3.3 3.3 0 0 0 .3-6.6 4.7 4.7 0 0 0-8.9-1 3.6 3.6 0 0 0 .4 7.2z"/></svg>',
  cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h9.4a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 7 18z"/></svg>',
  fog:'<svg viewBox="0 0 24 24"><path d="M4 8h13M3 12h18M5 16h13M8 20h9"/></svg>',
  rain:'<svg viewBox="0 0 24 24"><path d="M7 14.5h9.4a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 7 14.5z"/><path d="M9 17.5l-1 2.6M12.5 17.5l-1 2.6M16 17.5l-1 2.6"/></svg>',
  snow:'<svg viewBox="0 0 24 24"><path d="M7 14.5h9.4a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 7 14.5z"/><circle class="fill" cx="9" cy="18.6" r=".7"/><circle class="fill" cx="12.5" cy="19.6" r=".7"/><circle class="fill" cx="16" cy="18.6" r=".7"/></svg>',
  storm:'<svg viewBox="0 0 24 24"><path d="M7 14h9.4a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 7 14z"/><path d="M12.5 15l-2.2 3.4h2.4l-1.6 2.8"/></svg>',
  dot:'<svg viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="2"/></svg>',
  alarm:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6.5"/><path d="M12 10v3l2 1.3M5.5 6.5 3.2 4.6M18.5 6.5l2.3-1.9M7.6 18.6 6 20.6M16.4 18.6 18 20.6"/></svg>',
  server:'<svg viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="6.2" rx="1.4"/><rect x="4" y="13.3" width="16" height="6.2" rx="1.4"/><circle class="fill" cx="7.4" cy="7.6" r=".9"/><circle class="fill" cx="7.4" cy="16.4" r=".9"/></svg>',
};
const iconHTML = k => '<span class="icon">' + (ICONS[k] || ICONS.dot) + '</span>';
const WCODE = {  // open-meteo weather codes -> [icon key, label]
  0:['sun','Clear'],1:['partly','Mostly clear'],2:['partly','Partly cloudy'],3:['cloud','Cloudy'],
  45:['fog','Fog'],48:['fog','Rime fog'],51:['rain','Light drizzle'],53:['rain','Drizzle'],55:['rain','Drizzle'],
  61:['rain','Light rain'],63:['rain','Rain'],65:['rain','Heavy rain'],66:['rain','Freezing rain'],67:['rain','Freezing rain'],
  71:['snow','Light snow'],73:['snow','Snow'],75:['snow','Heavy snow'],77:['snow','Snow grains'],
  80:['rain','Showers'],81:['rain','Showers'],82:['storm','Heavy showers'],85:['snow','Snow showers'],86:['snow','Snow showers'],
  95:['storm','Thunderstorm'],96:['storm','Thunderstorm'],99:['storm','Hailstorm'] };
const wx = c => WCODE[c] || ['dot',''];

const el = {
  time: document.getElementById('time'),
  sec: document.getElementById('sec'),
  ampm: document.getElementById('ampm'),
  date: document.getElementById('date'),
  wxIcon: document.getElementById('wx-icon'),
  wxTemp: document.getElementById('wx-temp'),
  wxCond: document.getElementById('wx-cond'),
  forecast: document.getElementById('forecast'),
  tileForecast: document.getElementById('tile-forecast'),
  tileServer: document.getElementById('tile-server'),
  serverLabel: document.getElementById('server-label'),
  serverRow: document.getElementById('server-row'),
  tileMedia: document.getElementById('tile-media'),
  mediaArt: document.getElementById('media-art'),
  mediaPlex: document.getElementById('media-plex'),
  mediaLive: document.getElementById('media-live'),
  mediaLiveTitle: document.getElementById('media-live-title'),
  mediaLiveSub: document.getElementById('media-live-sub'),
  mediaLiveBar: document.getElementById('media-live-bar'),
  mediaLiveFill: document.querySelector('#media-live-bar i'),
  tileAlarm: document.getElementById('tile-alarm'),
  alarmTime: document.getElementById('alarm-time'),
  alarmWhen: document.getElementById('alarm-when'),
  tileNp: document.getElementById('tile-np'),
  npTitle: document.getElementById('np-title'),
  npSub: document.getElementById('np-sub'),
};

function fetchJson(url, timeout = 7000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  return fetch(url, { signal: controller.signal })
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.statusText)))
    .finally(() => clearTimeout(timer));
}
const show = (node, on) => node.classList.toggle('hidden', !on);

// ---- clock ----
let lastMinute = '', lastDate = '';
function tick() {
  const d = new Date();
  let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  const minute = h + ':' + String(d.getMinutes()).padStart(2, '0') + ap;
  if (minute !== lastMinute) {
    el.time.textContent = h + ':' + String(d.getMinutes()).padStart(2, '0');
    el.ampm.textContent = ap;
    lastMinute = minute;
  }
  // In overlay mode the #sec slot stays empty — mpv's aerial-clock.lua draws the
  // live seconds on top. Keep the element (fixed width) so AM/PM stays put.
  if (!OVERLAY) el.sec.textContent = ':' + String(d.getSeconds()).padStart(2, '0');
  const date = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  if (date !== lastDate) {
    el.date.textContent = date;
    lastDate = date;
  }
}
tick(); setInterval(tick, 1000);

// ---- weather (hub only: same-origin, server-cached, works with the internet down) ----
function renderWeather(r, city) {
  if (!r || !r.current || !r.daily) return;
  const [ic, label] = wx(r.current.weather_code);
  el.wxIcon.innerHTML = iconHTML(ic);
  el.wxTemp.textContent = Math.round(r.current.temperature_2m) + '°';
  el.wxCond.textContent = city ? (label + ' · ' + city) : label;
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < Math.min(7, r.daily.time.length); i++) {
    const fc = document.createElement('div');
    fc.className = 'fc';
    const dow = i === 0 ? 'Today' : days[new Date(r.daily.time[i] + 'T12:00').getDay()];
    const [di] = wx(r.daily.weather_code[i]);
    const hi = Math.round(r.daily.temperature_2m_max[i]);
    const lo = Math.round(r.daily.temperature_2m_min[i]);
    fc.innerHTML = `<div class="d">${dow}</div><div class="i">${iconHTML(di)}</div><div class="t">${hi}° <span class="lo">${lo}°</span></div>`;
    frag.appendChild(fc);
  }
  el.forecast.replaceChildren(frag);
  show(el.tileForecast, true);
}
function cachedWeather() {
  try { return JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || 'null'); }
  catch (e) { return null; }
}
function renderCachedWeather() {
  const cached = cachedWeather();
  if (cached && cached.data && Date.now() - cached.savedAt < 6 * 60 * 60 * 1000) {
    renderWeather(cached.data, cached.city || CITY);
  }
}
async function weather() {
  const cached = cachedWeather();
  if (cached && cached.data && Date.now() - cached.savedAt < WEATHER_FRESH) return;
  try {
    const q = params.has('lat') && params.has('lon') ? `?lat=${LAT}&lon=${LON}` : '';
    const r = await fetchJson('/api/weather' + q, 7000);
    if (r && r.data && r.data.current) {
      if (r.city) CITY = r.city;
      renderWeather(r.data, CITY);
      localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), city: CITY, data: r.data }));
    }
  } catch (e) {
    // No weather at all → hide the forecast tile (Part 4: never blank).
    if (!cached || !cached.data) show(el.tileForecast, false);
  }
}
renderCachedWeather();
weather();
setInterval(weather, 15 * 60 * 1000);

// ---- now playing (same-origin hub) ----
let lastNowPlaying = '';
async function nowPlaying() {
  try {
    const s = await fetchJson('/api/screen/status', 2500);
    if (s.playing && s.url) {
      let title, sub = s.subtitle || 'On the Pi';
      if (/\.m3u8/i.test(s.url)) { title = s.title || 'Livestream'; }
      else {
        const p = decodeURIComponent(s.url).split('/').filter(Boolean);
        const file = p.pop() || ''; title = s.title || p.pop() || file.replace(/\.[^.]+$/, '');
        if (!s.subtitle && s.source !== 'livestream') sub = 'On the Pi';
      }
      const sig = title + '\n' + sub;
      if (sig !== lastNowPlaying) {
        el.npTitle.textContent = title;
        el.npSub.textContent = sub;
        lastNowPlaying = sig;
      }
      show(el.tileNp, true);
    } else {
      lastNowPlaying = '';
      show(el.tileNp, false);
    }
  } catch (e) {}
}
nowPlaying(); setInterval(nowPlaying, 5000);

// ---- next alarm (same-origin hub) ----
async function nextAlarm() {
  try {
    const list = await fetchJson('/api/alarms', 3000);
    const now = new Date();
    let best = null;
    (list || []).filter(a => a.enabled && a.time).forEach(a => {
      const [hh, mm] = a.time.split(':').map(Number);
      const days = (a.days && a.days.length) ? a.days : [0, 1, 2, 3, 4, 5, 6];
      for (let d = 0; d < 8; d++) {
        const cand = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, hh, mm, 0, 0);
        const ourDay = (cand.getDay() + 6) % 7;   // JS Sun=0 → our Mon=0
        if (days.includes(ourDay) && cand > now) {
          if (!best || cand < best.cand) best = { a, cand };
          break;
        }
      }
    });
    if (!best) { show(el.tileAlarm, false); return; }
    const t = best.cand;
    let h = t.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    const tm = h + ':' + String(t.getMinutes()).padStart(2, '0') + ' ' + ap;
    const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const dd = Math.round((midnight(t) - midnight(now)) / 86400000);
    const when = dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow'
      : t.toLocaleDateString('en-US', { weekday: 'long' });
    const SRC = { appletv_music: 'Apple Music', livestream: 'Livestream',
      shuffle: 'Shuffle movies/TV', file: 'Server file', airplay: 'AirPlay' };
    const src = best.a.source || (best.a.method === 'airplay' ? 'airplay' : 'appletv_music');
    el.alarmTime.textContent = tm;
    el.alarmWhen.textContent = when + ' · ' + (SRC[src] || 'Apple Music');
    show(el.tileAlarm, true);
  } catch (e) { show(el.tileAlarm, false); }
}
nextAlarm(); setInterval(nextAlarm, 60 * 1000);

// ---- homelab status (same-origin hub; cache-first so a slow SSH probe never
//      stalls the overlay capture) ----
const DASH = '–';
function fmtClock(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
}
function stat(v, k) {
  const d = document.createElement('div'); d.className = 'stat';
  d.innerHTML = '<div class="v">' + (v == null || v === '' ? DASH : v) + '</div>'
              + '<div class="k">' + k + '</div>';
  return d;
}
function renderHomelab(h) {
  // server tile
  const row = el.serverRow;
  row.replaceChildren();
  el.serverLabel.textContent = 'Server';
  if (!h || !h.up) {
    const note = document.createElement('div');
    note.className = 'server-note';
    note.textContent = ((h && h.host) || roomHost) + ' offline';
    row.appendChild(note);
    show(el.tileServer, true);
  } else {
    const name = (h.plex && h.plex.name) || h.host || 'homelab';
    if (h.stats && h.stats.ok) {
      const s = h.stats;
      row.append(
        stat(h.latency_ms != null ? Math.round(h.latency_ms) + 'ms' : DASH, 'ping'),
        stat(s.cpu_pct != null ? s.cpu_pct + '%' : DASH, 'cpu'),
        stat(s.mem_pct != null ? s.mem_pct + '%' : DASH, 'ram'),
        stat(s.disk_pct != null ? s.disk_pct + '%' : DASH, 'disk'),
        stat(s.temp_c != null ? s.temp_c + '°' : DASH, 'temp'),
      );
    } else {
      const note = document.createElement('div');
      note.className = 'server-note';
      note.textContent = name + (h.latency_ms != null ? ' · ' + Math.round(h.latency_ms) + 'ms' : '');
      row.appendChild(note);
    }
    show(el.tileServer, true);
  }

  // media tile: Plex poster + line, livestream title/progress; hidden if none
  let any = false;
  const plex = h && h.plex && h.plex.ok ? h.plex : null;
  const live = h && h.live && h.live.ok && h.live.title ? h.live : null;

  // poster: the active Plex session's, else the live title's Plex poster
  const poster = (plex && plex.poster) || (live && live.poster) || null;
  if (poster) {
    const src = '/api/plex/artwork?key=' + encodeURIComponent(poster);
    if (el.mediaArt.getAttribute('src') !== src) el.mediaArt.setAttribute('src', src);
    show(el.mediaArt, true);
  } else {
    show(el.mediaArt, false);
  }

  if (plex) {
    const n = plex.sessions || 0;
    let txt = n === 0 ? 'Plex idle' : 'Plex ' + n + (n === 1 ? ' stream' : ' streams');
    if (plex.transcodes) txt += ' (' + plex.transcodes + ' transcode)';
    const titles = (plex.titles || []).filter(Boolean).slice(0, 3);
    el.mediaPlex.replaceChildren(document.createTextNode(txt));
    if (titles.length) {
      const s = document.createElement('span'); s.className = 'muted';
      s.textContent = ' · ' + titles.join(', ');
      el.mediaPlex.appendChild(s);
    }
    show(el.mediaPlex, true);
    any = true;
  } else {
    show(el.mediaPlex, false);
  }

  // livestream: title + position/duration. The hub serves the last good value
  // (stale) when the title API blips, so this persists instead of vanishing.
  if (live) {
    el.mediaLiveTitle.replaceChildren();
    if (live.playing) {
      const dot = document.createElement('span'); dot.className = 'live-dot';
      el.mediaLiveTitle.appendChild(dot);
    }
    el.mediaLiveTitle.appendChild(document.createTextNode(live.title));
    const pos = live.position, dur = live.duration;
    if (pos != null && dur) {
      el.mediaLiveSub.textContent = fmtClock(pos) + ' / ' + fmtClock(dur)
        + (live.stale ? ' · reconnecting' : '');
      el.mediaLiveFill.style.width = Math.min(100, 100 * pos / dur) + '%';
      show(el.mediaLiveSub, true);
      show(el.mediaLiveBar, true);
    } else {
      el.mediaLiveSub.textContent = live.stale ? 'reconnecting…' : '';
      show(el.mediaLiveSub, !!live.stale);
      show(el.mediaLiveBar, false);
    }
    show(el.mediaLive, true);
    any = true;
  } else {
    show(el.mediaLive, false);
  }
  show(el.tileMedia, any);
}
function cachedHomelab() {
  try { return JSON.parse(localStorage.getItem(HOMELAB_CACHE_KEY) || 'null'); }
  catch (e) { return null; }
}
async function homelabStatus() {
  const cached = cachedHomelab();
  const fresh = cached && cached.data && Date.now() - cached.savedAt < HOMELAB_FRESH;
  if (fresh) renderHomelab(cached.data);   // paint instantly, update in place below
  try {
    const h = await fetchJson('/api/homelab', 4000);
    renderHomelab(h);
    localStorage.setItem(HOMELAB_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: h }));
  } catch (e) {
    if (!cached || !cached.data) {           // endpoint failed and no cache → hide
      show(el.tileServer, false);
      show(el.tileMedia, false);
    } else if (!fresh) {
      renderHomelab(cached.data);            // stale cache beats blank
    }
  }
}
homelabStatus(); setInterval(homelabStatus, 60 * 1000);
</script>
</body>
</html>
