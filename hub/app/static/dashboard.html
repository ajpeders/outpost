<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Room</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "DejaVu Sans Mono", "JetBrains Mono", "Cascadia Code", ui-monospace, Menlo, Consolas, monospace;
    color: #fff;
    background: #05070d;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    /* readability over the aerial video / photo — all text is pure white */
    text-shadow: 0 2px 14px rgba(0,0,0,.55), 0 1px 4px rgba(0,0,0,.8);
  }
  /* simplistic monochrome (white) line icons — no color emoji */
  .icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.12em; }
  .icon svg { width: 100%; height: 100%; display: block; fill: none;
              stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
              filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  .icon .fill { fill: #fff; stroke: none; }
  /* overlay mode (?overlay=1): transparent page so mpv can composite the widgets
     over a hardware-decoded aerial video underneath (headless-rendered PNG). */
  body.overlay { background: transparent !important; }
  body.overlay #aurora, body.overlay .bg, body.overlay .vid { display: none !important; }
  body.overlay::after { display: none !important; }
  body.overlay .shell { text-shadow: 0 2px 18px rgba(0,0,0,.7); }
  body.overlay .sec { display: none; }   /* overlay refreshes per-minute, not per-second */

  /* ambient background: rotating scenic photo with a slow drift, over an aurora gradient */
  .bg, #aurora { position: fixed; inset: 0; z-index: -2; }
  #aurora {
    z-index: -3;
    background:
      radial-gradient(60% 80% at 20% 20%, #16324d 0%, transparent 60%),
      radial-gradient(60% 80% at 85% 15%, #0e3b3a 0%, transparent 55%),
      radial-gradient(80% 90% at 70% 90%, #241636 0%, transparent 60%),
      linear-gradient(160deg, #060a14, #05070d);
    /* static — an animated full-screen filter here starves the software video
       decoder (the Pi has no GL for chromium), causing choppy aerials. */
  }
  /* two layers that crossfade between photos (no hard flip) */
  .bg {
    background-size: cover; background-position: center;
    opacity: 0; transform: scale(1.06);
    transition: opacity 3s ease-in-out;
    will-change: opacity, transform;
  }
  .bg.show { opacity: .55; animation: kenburns 120s ease-in-out infinite alternate; }
  @keyframes kenburns { from { transform: scale(1.06) translate3d(0, 0, 0); } to { transform: scale(1.12) translate3d(-1%, -1%, 0); } }
  /* moving video aerials (Apple-TV style): two layers crossfade between clips.
     preferred over the photos; photos remain the fallback if video won't load. */
  .vid { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%;
         object-fit: cover; opacity: 0; transition: opacity 2.5s ease-in-out; }
  .vid.show { opacity: .5; }
  /* readability veil */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, rgba(3,5,10,.55) 0%, rgba(3,5,10,.15) 35%, rgba(3,5,10,.55) 100%);
  }

  .shell { height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 6vh 7vw; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .clock { display: inline-flex; align-items: center; font-size: 15vw; font-weight: 700;
           line-height: .9; font-variant-numeric: tabular-nums; }
  .clock .meta { display: inline-flex; flex-direction: column; margin-left: .18em; line-height: 1.08; }
  .clock .sec  { font-size: 3.6vw; font-weight: 600; }
  .clock .ampm { font-size: 3.6vw; font-weight: 600; }
  .date { font-size: 2.6vw; font-weight: 600; margin-top: .4vh; }

  .weather-now { text-align: right; }
  .wx-temp { font-size: 7vw; font-weight: 700; line-height: 1; }
  .wx-cond { font-size: 2vw; margin-top: .4vh; }
  .wx-icon { font-size: 6vw; line-height: 1; }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 4vw; }

  .forecast { display: flex; gap: 1.7vw; }
  .fc { text-align: center; }
  .fc .d { font-size: 1.25vw; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .fc .i { font-size: 2.6vw; margin: .3vh 0; }
  .fc .t { font-size: 1.45vw; font-weight: 600; white-space: nowrap; }
  .fc .t .lo { font-weight: 500; }

  .now-playing { max-width: 44vw; opacity: 0; transition: opacity .6s ease; }
  .now-playing.show { opacity: 1; }
  .np-label { font-size: 1.3vw; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .np-title { font-size: 2.6vw; font-weight: 700; margin-top: .3vh; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np-sub { font-size: 1.6vw; }

  /* bottom-left stack hierarchy: now-playing (loud) > alarm > homelab/room (quiet) */
  .alarm-next { font-size: 1.5vw; font-weight: 600; margin-top: 1.2vh; }
  .alarm-next .t { font-weight: 700; }
  .homelab { font-size: 1.3vw; font-weight: 600; margin-top: 1vh; opacity: .9;
             max-width: 54vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .homelab .sep { opacity: .55; margin: 0 .4em; }
  .homelab .live-dot { display: inline-block; width: .55em; height: .55em; border-radius: 50%;
                       background: #ff5252; margin-right: .3em; vertical-align: .05em;
                       box-shadow: 0 0 8px rgba(255,82,82,.8); }
  /* hostname label — shown verbatim (matches the machine's own capitalization) */
  .room { font-size: 1.3vw; font-weight: 700; letter-spacing: .04em; opacity: .85; }
</style>
</head>
<body>
  <div id="aurora"></div>
  <div class="bg" id="bg-a"></div>
  <div class="bg" id="bg-b"></div>
  <video class="vid" id="vid-a" muted loop playsinline preload="none"></video>
  <video class="vid" id="vid-b" muted loop playsinline preload="none"></video>

  <div class="shell">
    <div class="top">
      <div>
        <div class="clock"><span id="time">–</span><span class="meta"><span class="sec" id="sec"></span><span class="ampm" id="ampm"></span></span></div>
        <div class="date" id="date"></div>
      </div>
      <div class="weather-now">
        <div class="wx-icon" id="wx-icon">·</div>
        <div class="wx-temp" id="wx-temp">–</div>
        <div class="wx-cond" id="wx-cond"></div>
      </div>
    </div>

    <div class="bottom">
      <div>
        <div class="now-playing" id="np">
          <div class="np-label">Now Playing</div>
          <div class="np-title" id="np-title"></div>
          <div class="np-sub" id="np-sub"></div>
        </div>
        <div class="alarm-next" id="alarm-next"></div>
        <div class="homelab" id="homelab"></div>
        <div class="room" id="room" style="margin-top:1vh"></div>
      </div>
      <div class="forecast" id="forecast"></div>
    </div>
  </div>

<script>
// ---- config (guest-safe: time, weather, now-playing only) ----
const params = new URLSearchParams(location.search);
const roomHost = params.get('host') || location.hostname || 'pi';
let LAT = Number(params.get('lat')) || 39.7392;
let LON = Number(params.get('lon')) || -104.9903;
let CITY = params.get('city') || '';   // fallback; auto-detected below
const WEATHER_CACHE_KEY = 'livingroom-dashboard-weather-v2';
const GEO_CACHE_KEY = 'livingroom-dashboard-geo-v1';
// Overlay mode reloads this page every minute (headless chromium render), so
// external lookups must be cache-first: geolocation for a day, weather for
// 10 minutes. Without this every render re-hits ip-api + open-meteo and the
// render stalls on the network inside its virtual-time budget.
const GEO_TTL = 24 * 60 * 60 * 1000;
const WEATHER_FRESH = 10 * 60 * 1000;
// simplistic monochrome (white) line icons — no color emoji
const ICONS = {
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.5M12 18.9v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.6 12h2.5M18.9 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>',
  partly:'<svg viewBox="0 0 24 24"><circle cx="8" cy="7.5" r="2.8"/><path d="M8 2.4v1.5M3.5 7.5H2M13 7.5h-1.5M4.6 4.1l1 1M11.4 4.1l-1 1"/><path d="M7.5 19.5h8.2a3.3 3.3 0 0 0 .3-6.6 4.7 4.7 0 0 0-8.9-1 3.6 3.6 0 0 0 .4 7.2z"/></svg>',
  cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h9.4a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 7 18z"/></svg>',
  fog:'<svg viewBox="0 0 24 24"><path d="M4 8h13M3 12h18M5 16h13M8 20h9"/></svg>',
  rain:'<svg viewBox="0 0 24 24"><path d="M7 14.5h9.4a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 7 14.5z"/><path d="M9 17.5l-1 2.6M12.5 17.5l-1 2.6M16 17.5l-1 2.6"/></svg>',
  snow:'<svg viewBox="0 0 24 24"><path d="M7 14.5h9.4a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 7 14.5z"/><circle class="fill" cx="9" cy="18.6" r=".7"/><circle class="fill" cx="12.5" cy="19.6" r=".7"/><circle class="fill" cx="16" cy="18.6" r=".7"/></svg>',
  storm:'<svg viewBox="0 0 24 24"><path d="M7 14h9.4a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.2A3.9 3.9 0 0 0 7 14z"/><path d="M12.5 15l-2.2 3.4h2.4l-1.6 2.8"/></svg>',
  dot:'<svg viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="2"/></svg>',
  alarm:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6.5"/><path d="M12 10v3l2 1.3M5.5 6.5 3.2 4.6M18.5 6.5l2.3-1.9M7.6 18.6 6 20.6M16.4 18.6 18 20.6"/></svg>',
  server:'<svg viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="6.2" rx="1.4"/><rect x="4" y="13.3" width="16" height="6.2" rx="1.4"/><circle class="fill" cx="7.4" cy="7.6" r=".9"/><circle class="fill" cx="7.4" cy="16.4" r=".9"/></svg>',
};
const iconHTML = k => '<span class="icon">' + (ICONS[k] || ICONS.dot) + '</span>';
const WCODE = {  // open-meteo weather codes -> [icon key, label]
  0:['sun','Clear'],1:['partly','Mostly clear'],2:['partly','Partly cloudy'],3:['cloud','Cloudy'],
  45:['fog','Fog'],48:['fog','Rime fog'],51:['rain','Light drizzle'],53:['rain','Drizzle'],55:['rain','Drizzle'],
  61:['rain','Light rain'],63:['rain','Rain'],65:['rain','Heavy rain'],66:['rain','Freezing rain'],67:['rain','Freezing rain'],
  71:['snow','Light snow'],73:['snow','Snow'],75:['snow','Heavy snow'],77:['snow','Snow grains'],
  80:['rain','Showers'],81:['rain','Showers'],82:['storm','Heavy showers'],85:['snow','Snow showers'],86:['snow','Snow showers'],
  95:['storm','Thunderstorm'],96:['storm','Thunderstorm'],99:['storm','Hailstorm'] };
const wx = c => WCODE[c] || ['dot',''];

const el = {
  time: document.getElementById('time'),
  sec: document.getElementById('sec'),
  ampm: document.getElementById('ampm'),
  date: document.getElementById('date'),
  wxIcon: document.getElementById('wx-icon'),
  wxTemp: document.getElementById('wx-temp'),
  wxCond: document.getElementById('wx-cond'),
  forecast: document.getElementById('forecast'),
  np: document.getElementById('np'),
  npTitle: document.getElementById('np-title'),
  npSub: document.getElementById('np-sub'),
  room: document.getElementById('room'),
  alarmNext: document.getElementById('alarm-next'),
  homelab: document.getElementById('homelab'),
};

function fetchJson(url, timeout = 7000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  return fetch(url, { signal: controller.signal })
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.statusText)))
    .finally(() => clearTimeout(timer));
}

// ---- clock ----
let lastMinute = '', lastDate = '';
function tick() {
  const d = new Date();
  let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  const minute = h + ':' + String(d.getMinutes()).padStart(2, '0') + ap;
  if (minute !== lastMinute) {
    el.time.textContent = h + ':' + String(d.getMinutes()).padStart(2, '0');
    el.ampm.textContent = ap;
    lastMinute = minute;
  }
  el.sec.textContent = ':' + String(d.getSeconds()).padStart(2, '0');
  const date = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  if (date !== lastDate) {
    el.date.textContent = date;  // "Monday, July 6"
    lastDate = date;
  }
}
tick(); setInterval(tick, 1000);

// ---- location (auto via IP) + weather (full week) ----
async function geolocate() {
  if (params.has('lat') && params.has('lon')) return;
  try {
    const c = JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || 'null');
    if (c && c.lat && c.lon && Date.now() - c.savedAt < GEO_TTL) {
      LAT = c.lat; LON = c.lon; CITY = c.city || CITY;
      return;
    }
  } catch (e) {}
  try {
    const g = await fetchJson('http://ip-api.com/json/', 3000);
    if (g && g.lat && g.lon) {
      LAT = g.lat; LON = g.lon; CITY = g.city || CITY;
      try {
        localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(
          { savedAt: Date.now(), lat: LAT, lon: LON, city: CITY }));
      } catch (e) {}
    }
  } catch (e) {}
}
function renderWeather(r, city) {
  if (!r || !r.current || !r.daily) return;
  const [ic, label] = wx(r.current.weather_code);
  el.wxIcon.innerHTML = iconHTML(ic);
  el.wxTemp.textContent = Math.round(r.current.temperature_2m) + '°';
  el.wxCond.textContent = city ? (label + ' · ' + city) : label;
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < Math.min(7, r.daily.time.length); i++) {
    const fc = document.createElement('div');
    fc.className = 'fc';
    const dow = i === 0 ? 'Today' : days[new Date(r.daily.time[i] + 'T12:00').getDay()];
    const [di] = wx(r.daily.weather_code[i]);
    const hi = Math.round(r.daily.temperature_2m_max[i]);
    const lo = Math.round(r.daily.temperature_2m_min[i]);
    fc.innerHTML = `<div class="d">${dow}</div><div class="i">${iconHTML(di)}</div><div class="t">${hi}° <span class="lo">${lo}°</span></div>`;
    frag.appendChild(fc);
  }
  el.forecast.replaceChildren(frag);
}
function cachedWeather() {
  try { return JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || 'null'); }
  catch (e) { return null; }
}
function renderCachedWeather() {
  const cached = cachedWeather();
  if (cached && cached.data && Date.now() - cached.savedAt < 6 * 60 * 60 * 1000) {
    renderWeather(cached.data, cached.city || CITY);
  }
}
async function weather() {
  const cached = cachedWeather();
  if (cached && cached.data && Date.now() - cached.savedAt < WEATHER_FRESH) return;
  // Preferred: the hub's /api/weather — same-origin, server-side cached, works
  // with the internet down. The direct open-meteo path stays as a fallback for
  // dashboards served by an older hub.
  try {
    const q = params.has('lat') && params.has('lon') ? `?lat=${LAT}&lon=${LON}` : '';
    const r = await fetchJson('/api/weather' + q, 7000);
    if (r && r.data && r.data.current) {
      if (r.city) CITY = r.city;
      renderWeather(r.data, CITY);
      localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), city: CITY, data: r.data }));
      return;
    }
  } catch (e) {}
  try {
    await geolocate();
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min` +
      `&temperature_unit=fahrenheit&timezone=auto&forecast_days=7`;
    const r = await fetchJson(u, 7000);
    renderWeather(r, CITY);
    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), city: CITY, data: r }));
  } catch (e) {}
}
renderCachedWeather();
weather();
setInterval(weather, 15 * 60 * 1000);

// ---- now playing (same-origin hub) ----
let lastNowPlaying = '';
async function nowPlaying() {
  try {
    const s = await fetchJson('/api/screen/status', 2500);
    if (s.playing && s.url) {
      let title, sub = s.subtitle || 'On the Pi';
      if (/\.m3u8|live\.thelunadog/i.test(s.url)) { title = s.title || 'Jetstream livestream'; }
      else {
        const p = decodeURIComponent(s.url).split('/').filter(Boolean);
        const file = p.pop() || ''; title = s.title || p.pop() || file.replace(/\.[^.]+$/, '');
        if (!s.subtitle && s.source !== 'livestream') {
          sub = 'On the Pi';
        }
      }
      const sig = title + '\n' + sub;
      if (sig !== lastNowPlaying) {
        el.npTitle.textContent = title;
        el.npSub.textContent = sub;
        lastNowPlaying = sig;
      }
      el.np.classList.add('show');
    } else {
      lastNowPlaying = '';
      el.np.classList.remove('show');
    }
  } catch (e) {}
}
nowPlaying(); setInterval(nowPlaying, 5000);

// ---- ambient scenic background (rotating nature photos, graceful if offline) ----
const SCENES = [
  'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=76',  // misty forest
  'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=76',  // sunlit forest
  'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=76',  // mountains
  'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1920&q=76',  // rolling hills
  'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1920&q=76',  // lake
  'https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=1920&q=76',  // forest path
  'https://images.unsplash.com/photo-1418065460487-3e41a6c84dc5?auto=format&fit=crop&w=1920&q=76',  // green valley
  'https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1920&q=76',  // alpine lake
  'https://images.unsplash.com/photo-1424746219973-8fe3bd07d8e3?auto=format&fit=crop&w=1920&q=76',  // forest sunbeams
  'https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=1920&q=76',  // coastal cliffs
  'https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=1920&q=76',  // valley river
  'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1920&q=76',  // mountain lake
  'https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=1920&q=76',  // waterfall
  'https://images.unsplash.com/photo-1465056836041-7f43ac27dcb5?auto=format&fit=crop&w=1920&q=76',  // snowy peaks
  'https://images.unsplash.com/photo-1444525873963-75d329ef9e1b?auto=format&fit=crop&w=1920&q=76',  // desert dunes
  'https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=1920&q=76',  // green hills
];
let si = 0, bgActive = -1, photosRunning = false;
const bgLayers = [document.getElementById('bg-a'), document.getElementById('bg-b')];
function nextScene() {
  const url = SCENES[si % SCENES.length]; si++;
  const img = new Image();
  img.decoding = 'async';
  img.onload = () => {                       // crossfade: fade the new layer in, old out
    const next = bgActive === 0 ? 1 : 0;
    bgLayers[next].style.backgroundImage = `url("${url}")`;
    bgLayers[next].classList.add('show');
    if (bgActive >= 0) bgLayers[bgActive].classList.remove('show');
    bgActive = next;
  };
  img.src = url;                             // if it fails, the aurora gradient stays
}
function startPhotos() {                      // fallback if the aerials won't load
  if (photosRunning) return;
  photosRunning = true;
  nextScene(); setInterval(nextScene, 90 * 1000);
}

// ---- moving video aerials (Apple-TV style): the actual Apple tvOS aerials that
//      AerialViews uses, 1080p H.264 (url-1080-H264 from Apple's entries.json) so
//      chromium can software-decode them (no GL for chromium; HEVC won't play).
//      Two layers crossfade between clips; photos remain the fallback on error.
// Served locally by the hub (screen/fetch-aerials.sh caches + faststart-remuxes
// Apple's aerials into ./data/hub/aerials -> /aerials). Local + faststart so they
// start instantly and work fully offline; the app filters to what's on disk.
const AERIALS = [
  '/aerials/01-hawaii.mp4',
  '/aerials/02-new-york.mp4',
  '/aerials/03-dubai.mp4',
  '/aerials/04-hong-kong.mp4',
  '/aerials/05-london.mp4',
  '/aerials/06-greenland.mp4',
  '/aerials/07-new-zealand.mp4',
  '/aerials/08-aurora.mp4',
  '/aerials/09-china.mp4',
  '/aerials/10-san-francisco.mp4',
  '/aerials/11-caribbean.mp4',
  '/aerials/12-new-york-night.mp4',
];
let vi = 0, vidActive = -1, aerialsOk = false;
const vidLayers = [document.getElementById('vid-a'), document.getElementById('vid-b')];
function nextAerial() {
  const url = AERIALS[vi % AERIALS.length]; vi++;
  const next = vidActive === 0 ? 1 : 0;
  const v = vidLayers[next];
  v.oncanplay = () => {
    aerialsOk = true;
    v.play().catch(() => {});
    v.classList.add('show');
    if (vidActive >= 0) {
      const prev = vidLayers[vidActive];
      prev.classList.remove('show');
      setTimeout(() => { try { prev.pause(); } catch (e) {} }, 2600);
    }
    vidActive = next;
  };
  v.onerror = () => { if (!aerialsOk) startPhotos(); };  // network/codec issue → photos
  v.preload = 'auto';
  v.src = url;
  v.load();
}
// Default to the crossfading stills. The moving aerials are cached locally and
// faststart-remuxed (so they load), but this cage/chromium kiosk runs with
// --disable-gpu and DECODES the video without ever PAINTING it — the <video>
// stays black. Real moving aerials need mpv (Pi-5 hardware decode) behind a
// transparent chromium overlay (labwc), not <video> in cage. Opt in with
// ?bg=video only to demo/verify; photos are the working default.
if (params.has('overlay')) {
  // transparent widgets only; mpv draws the aerial underneath. No page bg.
  document.body.classList.add('overlay');
} else if (params.get('bg') === 'video') {
  nextAerial();
  setInterval(nextAerial, 45 * 1000);
  setTimeout(() => { if (!aerialsOk) startPhotos(); }, 8000);
} else {
  startPhotos();
}

// ---- room label = hostname (?host= from kiosk, else browser hostname) ----
el.room.textContent = roomHost;

// ---- next alarm (same-origin hub) ----
async function nextAlarm() {
  try {
    const list = await fetchJson('/api/alarms', 3000);
    const now = new Date();
    let best = null;
    (list || []).filter(a => a.enabled && a.time).forEach(a => {
      const [hh, mm] = a.time.split(':').map(Number);
      const days = (a.days && a.days.length) ? a.days : [0, 1, 2, 3, 4, 5, 6];
      for (let d = 0; d < 8; d++) {
        const cand = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, hh, mm, 0, 0);
        const ourDay = (cand.getDay() + 6) % 7;   // JS Sun=0 → our Mon=0
        if (days.includes(ourDay) && cand > now) {
          if (!best || cand < best.cand) best = { a, cand };
          break;
        }
      }
    });
    if (!best) { el.alarmNext.textContent = ''; return; }
    const t = best.cand;
    let h = t.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    const tm = h + ':' + String(t.getMinutes()).padStart(2, '0') + ' ' + ap;
    const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const dd = Math.round((midnight(t) - midnight(now)) / 86400000);
    const when = dd === 0 ? '' : dd === 1 ? ' tomorrow'
      : ' ' + t.toLocaleDateString('en-US', { weekday: 'long' });
    // show the media SOURCE (what will play), not the freeform label
    const SRC = { appletv_music: 'Apple Music', livestream: 'Livestream',
      shuffle: 'Shuffle movies/TV', file: 'Server file', airplay: 'AirPlay' };
    const src = best.a.source || (best.a.method === 'airplay' ? 'airplay' : 'appletv_music');
    el.alarmNext.innerHTML = iconHTML('alarm') + ' <span class="t">' + tm + '</span>'
      + (when + ' · ' + (SRC[src] || 'Apple Music'));
  } catch (e) { el.alarmNext.textContent = ''; }
}
nextAlarm(); setInterval(nextAlarm, 60 * 1000);

// ---- homelab status (same-origin hub; hub caches the probes) ----
function sep() { const s = document.createElement('span'); s.className = 'sep'; s.textContent = '·'; return s; }
async function homelabStatus() {
  try {
    const h = await fetchJson('/api/homelab', 4000);
    const box = el.homelab;
    box.replaceChildren();
    const icon = document.createElement('span');
    icon.innerHTML = iconHTML('server') + ' ';
    box.appendChild(icon);
    if (!h.up) { box.appendChild(document.createTextNode((h.host || 'homelab') + ' offline')); return; }
    const name = (h.plex && h.plex.name) || h.host || 'homelab';
    box.appendChild(document.createTextNode(name));
    if (h.latency_ms != null) {
      box.appendChild(sep());
      box.appendChild(document.createTextNode(Math.round(h.latency_ms) + 'ms'));
    }
    if (h.stats && h.stats.ok) {
      const s = h.stats;
      for (const txt of ['cpu ' + s.cpu_pct + '%', 'ram ' + s.mem_pct + '%',
                         s.disk_used_tb + '/' + s.disk_total_tb + 'T', s.temp_c + '°']) {
        box.appendChild(sep());
        box.appendChild(document.createTextNode(txt));
      }
    }
    if (h.plex && h.plex.ok) {
      box.appendChild(sep());
      const n = h.plex.sessions || 0;
      let plexTxt = n === 0 ? 'Plex idle' : 'Plex ' + n + (n === 1 ? ' stream' : ' streams');
      if (h.plex.transcodes) plexTxt += ' (' + h.plex.transcodes + ' transcode)';
      box.appendChild(document.createTextNode(plexTxt));
    }
    if (h.live && h.live.ok && h.live.playing && h.live.title) {
      box.appendChild(sep());
      const dot = document.createElement('span'); dot.className = 'live-dot';
      box.appendChild(dot);
      box.appendChild(document.createTextNode(h.live.title));
    }
  } catch (e) { el.homelab.replaceChildren(); }
}
homelabStatus(); setInterval(homelabStatus, 60 * 1000);
</script>
