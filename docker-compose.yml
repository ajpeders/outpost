# Self-contained living-room stack — runs entirely on the Pi 5, no homelab
# dependency. Both services use host networking: pyatv wants it for Apple TV
# discovery/streaming, and CEC is local hardware anyway.

# Cap container logs — the UI polls the hub every few seconds, and unrotated
# json-file logs grow without bound on the SD card (85MB in the first 12 days).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  appletv:
    container_name: appletv
    build: ./appletv
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    environment:
      TZ: ${TZ:-UTC}
      ATV_ADDRESS: ${ATV_ADDRESS}
      ATV_NAME: ${ATV_NAME:-Apple TV}
      ATV_STORAGE: /data/pyatv.conf
      PORT: ${ATV_API_PORT:-8010}
    volumes:
      - ./data/appletv:/data          # pyatv credential store

  cec:
    container_name: cec
    build: ./cec
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    environment:
      PORT: ${CEC_API_PORT:-8020}
    devices:
      - /dev/cec0:/dev/cec0           # the Pi 5 HDMI-CEC bus

  hub:
    container_name: hub
    build: ./hub
    restart: unless-stopped
    network_mode: host                # localhost:8010/:8020 reach the two services
    logging: *default-logging
    environment:
      PORT: ${HUB_PORT:-8080}
      ATV_URL: http://localhost:${ATV_API_PORT:-8010}
      CEC_URL: http://localhost:${CEC_API_PORT:-8020}
      TZ: ${TZ:-UTC}                   # alarm times are wall-clock in this zone
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      # Pi-side mpv screen player (fallback) + the homelab jetstream broadcast.
      # JETSTREAM_URL is the plain HLS manifest — jetstream grants /hls/ to LAN
      # clients tokenless, so the AirPlaying Apple TV needs no auth in the URL.
      SCREEN_URL: http://localhost:${SCREEN_PORT:-9595}
      JETSTREAM_URL: ${JETSTREAM_URL:-}
      JETSTREAM_TITLE: ${JETSTREAM_TITLE:-}
      JETSTREAM_TITLE_URL: ${JETSTREAM_TITLE_URL:-}
      JETSTREAM_SKIP_URL: ${JETSTREAM_SKIP_URL:-}
      JETSTREAM_COOKIE: ${JETSTREAM_COOKIE:-}
      # Homelab system stats over SSH (/api/homelab); empty disables the probe
      HOMELAB_SSH: ${HOMELAB_SSH:-}
    volumes:
      - ./data/hub:/data              # alarms.json + cached aerials live here
      - ./hub/app/static:/app/app/static   # serve dashboard/index edits without a rebuild
      - ${HUB_SSH_DIR:-./data/ssh}:/ssh:ro   # homelab stats probe key + known_hosts
    depends_on:
      - appletv
      - cec
